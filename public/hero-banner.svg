<svg width="2400" height="700" viewBox="0 0 2400 700" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Illustration d'ambiance : intérieur cosy et paysage de montagne</title>
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f14" />
      <stop offset="55%" stop-color="#120d08" />
      <stop offset="100%" stop-color="#0a0705" />
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9a441" stop-opacity="0" />
      <stop offset="50%" stop-color="#d9a441" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#d9a441" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="75%" stop-color="#000000" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.65" />
    </radialGradient>
  </defs>

  <rect width="2400" height="700" fill="url(#skyGrad)" />

  <!-- montagnes lointaines, cote droit -->
  <g opacity="0.5" fill="#3a2c1c">
    <polygon points="1500,700 1680,320 1820,520 1950,260 2150,560 2400,380 2400,700" />
  </g>
  <g opacity="0.75" fill="#241a10">
    <polygon points="1550,700 1750,400 1900,560 2050,340 2250,600 2400,470 2400,700" />
  </g>
  <g opacity="0.95" fill="#150f0a">
    <polygon points="1650,700 1820,480 1980,620 2120,420 2320,650 2400,560 2400,700" />
  </g>

  <!-- lueur horizon -->
  <ellipse cx="1950" cy="470" rx="420" ry="90" fill="url(#glow)" />

  <!-- pile de livres + tasse, cote gauche -->
  <g transform="translate(60,470)">
    <rect x="0" y="60" width="230" height="34" rx="3" fill="#3c2c1c" />
    <rect x="10" y="26" width="210" height="34" rx="3" fill="#4a3521" />
    <rect x="0" y="-8" width="230" height="34" rx="3" fill="#3c2c1c" />
    <rect x="10" y="-10" width="150" height="2" fill="#d9a441" opacity="0.5" />
    <rect x="10" y="24" width="150" height="2" fill="#d9a441" opacity="0.4" />

    <ellipse cx="330" cy="150" rx="70" ry="14" fill="#000000" opacity="0.35" />
    <path d="M280 60 h100 v60 a50 50 0 0 1 -100 0 z" fill="#241a10" />
    <path d="M380 80 q30 5 30 30 q0 25 -30 22 z" fill="none" stroke="#241a10" stroke-width="8" />
    <rect x="278" y="52" width="104" height="10" rx="4" fill="#150f0a" />
  </g>

  <!-- filets dores decoratifs -->
  <line x1="700" y1="350" x2="700" y2="0" stroke="#d9a441" stroke-opacity="0.25" stroke-width="1" />
  <line x1="1700" y1="350" x2="1700" y2="700" stroke="#d9a441" stroke-opacity="0.25" stroke-width="1" />

  <rect width="2400" height="700" fill="url(#vignette)" />
</svg>
